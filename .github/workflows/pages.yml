name: Test and deploy Windward

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Run game tests
        run: node --test engine.test.cjs navigation.test.cjs
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Prepare only browser assets
        run: |
          mkdir -p _site
          cp index.html style.css geography.js navigation.js engine.js sea-ui.js voyage-ui.js app.js LICENSE _site/
          mkdir -p _site/assets
          cp assets/harbor-town.webp _site/assets/
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy game
        id: deployment
        uses: actions/deploy-pages@v4
